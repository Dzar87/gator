# file compose.yml
---

services:
  postgres:
    restart: always
    image: postgres:18
    volumes:
      - gator-pgdata:/var/lib/postgresql/
    environment:
      POSTGRES_USER: ${DB_USER:-gator}
      POSTGRES_PASSWORD: ${DB_PASS:-gator_pass}
      POSTGRES_DB: ${DB_NAME:-gator}
    ports:
      - 5432:5432

volumes:
  gator-pgdata:

networks:
  default:
    name: gator-dev-network
